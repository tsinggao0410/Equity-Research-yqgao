<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="960" height="450" fill="#ffffff"/>

  <!-- 标题行 -->
  <g font-size="14" font-weight="700" fill="#1c2128">
    <text x="16" y="24">可插拔光模块(当前主流)</text>
    <text x="336" y="24">NPO 近封装光学(过渡方案)</text>
    <text x="656" y="24">CPO 共封装光学</text>
  </g>
  <g font-size="11" fill="#5b6370">
    <text x="16" y="42">交换机俯视:光器件在前面板</text>
    <text x="336" y="42">光引擎移到主板上、芯片旁</text>
    <text x="656" y="42">光引擎与芯片封装在同一基板</text>
  </g>

  <!-- ===== 面板 1:可插拔 ===== -->
  <rect x="16" y="54" width="288" height="290" fill="#fafbfc" stroke="#9aa1ab"/>
  <rect x="120" y="86" width="80" height="80" fill="#1f3a5f"/>
  <text x="160" y="122" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">交换</text>
  <text x="160" y="140" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">芯片</text>
  <g stroke="#a4532e" stroke-width="1.4" fill="none">
    <path d="M128,166 C128,230 42,240 42,292"/>
    <path d="M142,166 C142,236 86,244 86,292"/>
    <path d="M154,166 C154,240 130,250 130,292"/>
    <path d="M166,166 C166,240 190,250 190,292"/>
    <path d="M178,166 C178,236 234,244 234,292"/>
    <path d="M192,166 C192,230 278,240 278,292"/>
  </g>
  <g fill="#fff" stroke="#1f3a5f" stroke-width="1.2">
    <rect x="28" y="292" width="28" height="52"/><rect x="72" y="292" width="28" height="52"/>
    <rect x="116" y="292" width="28" height="52"/><rect x="176" y="292" width="28" height="52"/>
    <rect x="220" y="292" width="28" height="52"/><rect x="264" y="292" width="28" height="52"/>
  </g>
  <rect x="226" y="198" width="72" height="20" fill="#fafbfc"/>
  <text x="262" y="212" font-size="11" fill="#a4532e" text-anchor="middle">电走线:厘米级</text>
  <line x1="16" y1="344" x2="304" y2="344" stroke="#1c2128" stroke-width="3"/>
  <g font-size="11.5" fill="#1c2128">
    <text x="16" y="366">前面板:光模块(内含 DSP、激光器、探测器)</text>
    <text x="16" y="384" fill="#5b6370">单个模块故障可拔出更换,不停机</text>
  </g>

  <!-- ===== 面板 2:NPO ===== -->
  <rect x="336" y="54" width="288" height="290" fill="#fafbfc" stroke="#9aa1ab"/>
  <rect x="440" y="106" width="80" height="80" fill="#1f3a5f"/>
  <text x="480" y="142" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">交换</text>
  <text x="480" y="160" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">芯片</text>
  <!-- 光引擎(插座上) -->
  <g fill="#fff" stroke="#1f3a5f" stroke-width="1.2">
    <rect x="378" y="112" width="30" height="22"/><rect x="378" y="158" width="30" height="22"/>
    <rect x="552" y="112" width="30" height="22"/><rect x="552" y="158" width="30" height="22"/>
    <rect x="446" y="66" width="30" height="20"/><rect x="484" y="66" width="30" height="20"/>
    <rect x="446" y="206" width="30" height="20"/><rect x="484" y="206" width="30" height="20"/>
  </g>
  <g stroke="#a4532e" stroke-width="1.4" fill="none">
    <path d="M408,123 H440 M408,169 H440 M520,123 H552 M520,169 H552 M461,86 V106 M499,86 V106 M461,186 V206 M499,186 V206"/>
  </g>
  <g stroke="#1f3a5f" stroke-width="1.1" fill="none">
    <path d="M393,180 C393,250 364,262 364,300"/>
    <path d="M461,226 C461,262 420,270 420,300"/>
    <path d="M499,226 C499,262 540,270 540,300"/>
    <path d="M567,180 C567,250 596,262 596,300"/>
  </g>
  <g fill="#fff" stroke="#1f3a5f" stroke-width="1.2">
    <rect x="352" y="300" width="24" height="44"/><rect x="408" y="300" width="24" height="44"/>
    <rect x="528" y="300" width="24" height="44"/><rect x="584" y="300" width="24" height="44"/>
  </g>
  <text x="398" y="100" font-size="11" fill="#a4532e" text-anchor="middle">电走线:缩短</text>
  <text x="596" y="102" font-size="11" fill="#1f3a5f" text-anchor="end">光引擎</text>
  <line x1="336" y1="344" x2="624" y2="344" stroke="#1c2128" stroke-width="3"/>
  <g font-size="11.5" fill="#1c2128">
    <text x="336" y="366">前面板:只剩光纤接口</text>
    <text x="336" y="384" fill="#5b6370">光引擎插在主板插座上,开箱可单独更换</text>
  </g>

  <!-- ===== 面板 3:CPO ===== -->
  <rect x="656" y="54" width="288" height="290" fill="#fafbfc" stroke="#9aa1ab"/>
  <rect x="728" y="80" width="144" height="144" fill="#eef1f5" stroke="#1f3a5f" stroke-dasharray="5 3"/>
  <text x="800" y="96" font-size="10.5" fill="#1f3a5f" text-anchor="middle">同一封装基板</text>
  <rect x="770" y="122" width="60" height="60" fill="#1f3a5f"/>
  <text x="800" y="149" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">交换</text>
  <text x="800" y="166" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">芯片</text>
  <g fill="#fff" stroke="#1f3a5f" stroke-width="1.2">
    <rect x="738" y="128" width="26" height="18"/><rect x="738" y="158" width="26" height="18"/>
    <rect x="836" y="128" width="26" height="18"/><rect x="836" y="158" width="26" height="18"/>
    <rect x="774" y="102" width="22" height="14"/><rect x="804" y="102" width="22" height="14"/>
    <rect x="774" y="188" width="22" height="14"/><rect x="804" y="188" width="22" height="14"/>
  </g>
  <!-- 光纤:光引擎 → 前面板接口 -->
  <g stroke="#1f3a5f" stroke-width="1.1" fill="none">
    <path d="M751,176 C751,260 684,268 684,300"/>
    <path d="M785,202 C785,262 740,272 740,300"/>
    <path d="M815,202 C815,262 796,272 796,300"/>
    <path d="M849,176 C849,256 852,268 852,300"/>
  </g>
  <!-- 外置激光光源:经光纤给光引擎供光 -->
  <g stroke="#a4532e" stroke-width="1.1" fill="none" stroke-dasharray="4 3">
    <path d="M908,300 C908,230 880,190 862,176"/>
    <path d="M908,300 C908,210 888,150 862,146"/>
  </g>
  <g fill="#fff" stroke="#1f3a5f" stroke-width="1.2">
    <rect x="672" y="300" width="24" height="44"/><rect x="728" y="300" width="24" height="44"/>
    <rect x="784" y="300" width="24" height="44"/><rect x="840" y="300" width="24" height="44"/>
  </g>
  <rect x="892" y="296" width="32" height="48" fill="#f8f1ed" stroke="#a4532e" stroke-width="1.4"/>
  <text x="908" y="286" font-size="11" fill="#a4532e" text-anchor="middle">光源</text>
  <text x="888" y="112" font-size="11" fill="#1f3a5f" text-anchor="start">光引擎</text>
  <text x="706" y="252" font-size="11" fill="#a4532e" text-anchor="middle">电走线:毫米级</text>
  <line x1="656" y1="344" x2="944" y2="344" stroke="#1c2128" stroke-width="3"/>
  <g font-size="11.5" fill="#1c2128">
    <text x="656" y="366">前面板:光纤接口 + 外置激光光源(可插拔)</text>
    <text x="656" y="384" fill="#5b6370">光引擎难以单独更换;激光器外置以便维修</text>
  </g>

  <!-- 图例 -->
  <g font-size="11" fill="#5b6370">
    <line x1="16" y1="424" x2="40" y2="424" stroke="#a4532e" stroke-width="1.4"/>
    <text x="46" y="428">电走线(铜)</text>
    <line x1="140" y1="424" x2="164" y2="424" stroke="#1f3a5f" stroke-width="1.1"/>
    <text x="170" y="428">光纤(只画出部分)</text>
    <line x1="262" y1="424" x2="286" y2="424" stroke="#a4532e" stroke-width="1.1" stroke-dasharray="4 3"/>
    <text x="292" y="428">外置光源供光</text>
    <rect x="390" y="417" width="12" height="12" fill="#1f3a5f"/>
    <text x="408" y="428">交换芯片</text>
    <rect x="478" y="417" width="14" height="12" fill="#fff" stroke="#1f3a5f"/>
    <text x="498" y="428">光模块 / 光引擎 / 光纤接口</text>
    <text x="944" y="428" text-anchor="end">示意,不按比例</text>
  </g>
</svg>
