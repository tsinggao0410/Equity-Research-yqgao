  <text x="186" y="68" font-size="12" font-weight="700" fill="#1a2233">关系视图</text>
  <g stroke="#9aa4b5" stroke-width="1.6" fill="none">
    <line x1="352" y1="222" x2="258" y2="137"/><line x1="352" y1="222" x2="446" y2="137"/>
    <line x1="352" y1="222" x2="258" y2="318"/><line x1="446" y1="137" x2="446" y2="318"/>
  </g>
  <g font-size="10.5" fill="#5a6478">
