    <text x="30" y="243" fill="#1a2233">订单 · 交付批次 7</text>
    <line x1="24" y1="152" x2="156" y2="152" stroke="#e4e8ef"/><line x1="24" y1="186" x2="156" y2="186" stroke="#e4e8ef"/>
    <line x1="24" y1="220" x2="156" y2="220" stroke="#e4e8ef"/>
  </g>
  <text x="24" y="372" font-size="10.5" fill="#5a6478">数据来源(实时同步)</text>
