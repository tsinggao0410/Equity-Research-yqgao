  <text x="546" y="68" font-size="12" font-weight="700" fill="#1a2233">可执行动作</text>
  <g font-size="11.5">
    <rect x="546" y="78" width="150" height="28" rx="6" fill="#ffffff" stroke="#0f4c81"/><text x="621" y="96" text-anchor="middle" fill="#0f4c81">调整排产</text>
    <rect x="546" y="112" width="150" height="28" rx="6" fill="#ffffff" stroke="#0f4c81"/><text x="621" y="130" text-anchor="middle" fill="#0f4c81">切换供应商</text>
    <rect x="546" y="146" width="150" height="28" rx="6" fill="#ffffff" stroke="#0f4c81"/><text x="621" y="164" text-anchor="middle" fill="#0f4c81">通知采购</text>
  </g>
  <rect x="546" y="192" width="150" height="208" rx="8" fill="#f5f3ff" stroke="#d9d2f5"/>
  <text x="558" y="212" font-size="12" font-weight="700" fill="#3f2f99">AI 助手</text>
  <g font-size="10.8" fill="#1a2233">
    <text x="558" y="234">受阻原因:舱门作动筒</text>
    <text x="558" y="250">缺件,部件厂 B 交期延后。</text>
    <text x="558" y="274">建议:切换至备选</text>
    <text x="558" y="290">供应商 C,并将 MSN 0412</text>
    <text x="558" y="306">调至总装站 42。</text>
  </g>
  <rect x="558" y="322" width="60" height="26" rx="6" fill="#0f4c81"/><text x="588" y="339" font-size="11.5" fill="#ffffff" text-anchor="middle">批准</text>
  <rect x="626" y="322" width="60" height="26" rx="6" fill="#ffffff" stroke="#9aa4b5"/><text x="656" y="339" font-size="11.5" fill="#5a6478" text-anchor="middle">驳回</text>
  <text x="558" y="372" font-size="10.3" fill="#5a6478">审批后写回</text>
  <text x="558" y="387" font-size="10.3" fill="#5a6478">ERP、MES 与采购系统</text>
