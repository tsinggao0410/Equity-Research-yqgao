<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#f7f8fa"/>
  <rect x="10" y="10" width="700" height="420" rx="10" fill="#ffffff" stroke="#d5dce6"/>
  <path d="M10 20 a10 10 0 0 1 10 -10 h680 a10 10 0 0 1 10 10 v24 h-700 z" fill="#0f4c81"/>
  <circle cx="26" cy="27" r="4" fill="#ffffff" opacity=".55"/><circle cx="40" cy="27" r="4" fill="#ffffff" opacity=".55"/><circle cx="54" cy="27" r="4" fill="#ffffff" opacity=".55"/>
  <text x="72" y="32" font-size="13" font-weight="700" fill="#ffffff">运营中心 · A350 总装</text>
  <text x="696" y="32" font-size="11" fill="#cfe0f1" text-anchor="end">Foundry + AIP 界面示意</text>
  <!-- 左栏:业务对象 -->
