  <text x="258" y="315" font-size="12" font-weight="700" fill="#1a2233" text-anchor="middle">交付批次 7</text><text x="258" y="331" font-size="10.5" fill="#5a6478" text-anchor="middle">交付日期受影响</text>
  <rect x="386" y="296" width="120" height="44" rx="9" fill="#ffffff" stroke="#cfd8e4" stroke-width="1.5"/>
  <text x="446" y="315" font-size="12" font-weight="700" fill="#1a2233" text-anchor="middle">部件厂 B</text><text x="446" y="331" font-size="10.5" fill="#5a6478" text-anchor="middle">交期延后</text>
