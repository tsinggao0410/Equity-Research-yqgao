  <text x="258" y="132" font-size="12" font-weight="700" fill="#1a2233" text-anchor="middle">总装站 40</text><text x="258" y="148" font-size="10.5" fill="#c2521f" text-anchor="middle">排队等待</text>
  <rect x="386" y="113" width="120" height="44" rx="9" fill="#fff4ee" stroke="#eb6834" stroke-width="1.5"/>
  <text x="446" y="132" font-size="12" font-weight="700" fill="#1a2233" text-anchor="middle">舱门作动筒</text><text x="446" y="148" font-size="10.5" fill="#c2521f" text-anchor="middle">缺件</text>
