<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f4c81"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>

  <!-- 列标题 -->
  <g fill="#1a2233" font-size="13" font-weight="700">
    <text x="16" y="26">客户现有系统</text>
    <text x="250" y="26">本体(Ontology)</text>
    <text x="534" y="26">应用与 AI</text>
  </g>
  <g fill="#5a6478" font-size="11">
    <text x="16" y="44">原系统照常运行,不替换</text>
    <text x="250" y="44">把数据按业务对象重新组织</text>
    <text x="534" y="44">在本体上分析、决策、执行</text>
  </g>

  <!-- 第一列:原有系统 -->
  <g font-size="12" fill="#1a2233">
    <rect x="16" y="60" width="170" height="40" fill="#fff" stroke="#9aa4b5"/>
    <text x="28" y="85">财务与采购系统</text>
    <rect x="16" y="108" width="170" height="40" fill="#fff" stroke="#9aa4b5"/>
    <text x="28" y="133">生产执行系统</text>
    <rect x="16" y="156" width="170" height="40" fill="#fff" stroke="#9aa4b5"/>
    <text x="28" y="181">供应链与物流系统</text>
    <rect x="16" y="204" width="170" height="40" fill="#fff" stroke="#9aa4b5"/>
    <text x="28" y="229">设备传感器数据</text>
    <rect x="16" y="252" width="170" height="40" fill="#fff" stroke="#9aa4b5"/>
    <text x="28" y="277">文档、邮件、图片</text>
  </g>
  <!-- 汇总到本体 -->
  <g stroke="#0f4c81" stroke-width="1.2" fill="none">
    <path d="M186,80 H212 M186,128 H212 M186,176 H212 M186,224 H212 M186,272 H212 M212,80 V272"/>
    <path d="M212,176 H248" marker-end="url(#an)"/>
  </g>
  <text x="216" y="168" font-size="10.5" fill="#0f4c81">接入</text>

  <!-- 第二列:本体 -->
  <rect x="250" y="60" width="220" height="232" fill="#e8f0f8" stroke="#0f4c81" stroke-width="1.5"/>
  <g font-size="11.5" fill="#5a6478">
    <rect x="262" y="72" width="196" height="64" fill="#fff" stroke="#cfd8e4"/>
    <text x="274" y="93" font-size="12.5" font-weight="700" fill="#0f4c81">对象与属性</text>
    <text x="274" y="112">飞机、零件、工单、供应商</text>
    <text x="274" y="128">每个对象带状态与历史记录</text>
    <rect x="262" y="146" width="196" height="64" fill="#fff" stroke="#cfd8e4"/>
    <text x="274" y="167" font-size="12.5" font-weight="700" fill="#0f4c81">关系</text>
    <text x="274" y="186">零件属于哪架飞机</text>
    <text x="274" y="202">工单对应哪个工位、哪家供应商</text>
    <rect x="262" y="220" width="196" height="64" fill="#fff" stroke="#0f4c81" stroke-width="1.5"/>
    <text x="274" y="241" font-size="12.5" font-weight="700" fill="#0f4c81">动作</text>
    <text x="274" y="260">调整排产、切换供应商、下采购单</text>
    <text x="274" y="276">预先定义,带权限,可执行</text>
  </g>
  <path d="M470,176 H532" stroke="#0f4c81" stroke-width="1.2" fill="none" marker-end="url(#an)"/>
  <text x="488" y="168" font-size="10.5" fill="#0f4c81">调用</text>

  <!-- 第三列:应用与 AI -->
  <g font-size="11.5" fill="#5a6478">
    <rect x="534" y="60" width="170" height="68" fill="#fff" stroke="#9aa4b5"/>
    <text x="546" y="83" font-size="12.5" font-weight="700" fill="#1a2233">运营应用</text>
    <text x="546" y="102">看板、工作流、排产台</text>
    <text x="546" y="118">一线人员日常使用</text>
    <rect x="534" y="138" width="170" height="68" fill="#fff" stroke="#9aa4b5"/>
    <text x="546" y="161" font-size="12.5" font-weight="700" fill="#1a2233">分析与模拟</text>
    <text x="546" y="180">根因追溯、情景推演</text>
    <text x="546" y="196">管理层决策</text>
    <rect x="534" y="216" width="170" height="76" fill="#fff" stroke="#9aa4b5"/>
    <text x="546" y="239" font-size="12.5" font-weight="700" fill="#1a2233">AI 智能体(AIP)</text>
    <text x="546" y="258">在权限内读取对象、起草方案</text>
    <text x="546" y="274">经人工审批后调用「动作」</text>
  </g>

  <!-- 写回 -->
  <path d="M619,292 V322 H101 V296" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#ab)"/>
  <rect x="262" y="313" width="196" height="18" fill="#ffffff"/>
  <text x="360" y="326" font-size="11.5" font-weight="700" fill="#eb6834" text-anchor="middle">审批后指令写回原系统执行</text>

  <!-- 部署层 -->
  <rect x="16" y="344" width="688" height="36" fill="#eef1f5"/>
  <text x="360" y="367" font-size="12" fill="#1a2233" text-anchor="middle"><tspan font-weight="700">部署层(Apollo)</tspan>:同一套软件部署到公有云、客户机房、涉密网络与断网设备</text>
  <text x="16" y="404" font-size="11" fill="#5a6478">权限控制贯穿各层:同一对象,不同人员可见的数据范围不同。</text>
  <g font-size="11" fill="#5a6478">
    <line x1="470" y1="400" x2="494" y2="400" stroke="#0f4c81" stroke-width="1.2"/>
    <text x="500" y="404">数据与调用</text>
    <line x1="570" y1="400" x2="594" y2="400" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="600" y="404">决策写回</text>
  </g>
</svg>
